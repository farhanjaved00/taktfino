name: Article drafts
# Plan §12: brief (content/queue-<lang>.csv) → AI draft → review → publish. Runs for EVERY live language that has a queue.
# Mon/Wed/Fri = 3 drafts per language per week.
#   AUTO_PUBLISH on (default; repo variable unset or 'true'): pushes to main; drafts that pass every automatic check are indexable at once, the rest stay noindex.
#   AUTO_PUBLISH repo variable = 'false': opens a pull request instead; drafts stay reviewed:false (noindex) until a native speaker approves.
on:
  schedule:
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      count:
        description: 'Drafts per language'
        default: '1'
      lang:
        description: 'Only this language (empty = all live languages)'
        default: ''
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: { group: articles, cancel-in-progress: false }
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
          ARTICLES_PER_RUN: ${{ github.event.inputs.count || vars.ARTICLES_PER_RUN || '1' }}
          LANG_CODE: ${{ github.event.inputs.lang || 'all' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
          PR_BODY: ${{ runner.temp }}/pr-body.md
        run: npx tsx scripts/generate-articles.mjs
      - name: Check the site still builds
        run: npm test && npm run build && node scripts/check-links.mjs
      - name: Run summary
        run: cat "${{ runner.temp }}/pr-body.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish directly (AUTO_PUBLISH)
        if: vars.AUTO_PUBLISH != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content content
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add AI-drafted guides" && git push
      - name: Ping search engines (bot pushes don't trigger other workflows, so start IndexNow explicitly)
        if: vars.AUTO_PUBLISH != 'false'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run indexnow.yml --ref main || true
      - name: Open pull request for review
        if: vars.AUTO_PUBLISH == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: drafts/${{ github.run_id }}
          title: 'Ratgeber-Entwurf zur Prüfung'
          commit-message: 'Add AI-drafted guide for native review'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: draft-review
          delete-branch: true
