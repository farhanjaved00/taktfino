name: Daily rebuild
# Rebuilds the site every day just after midnight US Eastern (05:10 UTC) so every "from today" page has the
# right US date in its HTML. Browsers recalculate locally for every other time zone.
on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Add the CF_PAGES_DEPLOY_HOOK secret (see README)"; exit 1; fi
          curl -fsS -X POST "$HOOK"
