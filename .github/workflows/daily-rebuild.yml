name: Daily rebuild
# Rebuilds the site every day at 00:05 UTC so every "from today" page has the right date in its HTML.
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Add the CF_PAGES_DEPLOY_HOOK secret (see README)"; exit 1; fi
          curl -fsS -X POST "$HOOK"
