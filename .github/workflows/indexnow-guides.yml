name: IndexNow — new guides
# When guides are merged to main, tell Bing/ChatGPT search about them once Cloudflare has deployed.
on:
  push:
    branches: [main]
    paths: ['src/content/guides/**']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: sleep 240 && node scripts/indexnow.mjs guides pages
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
