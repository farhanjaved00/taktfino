name: Yearly Bundesland update
# Every Jan 2: Bundesland pages move to "<year>/<year+1>". Only pages passing the fact check are replaced;
# tests + build must pass before anything is pushed.
on:
  schedule:
    - cron: '0 5 2 1 *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - env: { OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}' }
        run: npx tsx scripts/roll-regions.mjs
      - run: npm test && npm run build && node scripts/check-links.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content
          git diff --cached --quiet && exit 0
          git commit -m "Yearly Bundesland update" && git push
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run indexnow.yml --ref main || true
