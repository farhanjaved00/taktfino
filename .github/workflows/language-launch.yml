name: Language launch
# Master Plan v2 §2/§21: when a language is due (src/data/language-schedule.json) draft it completely with OpenAI:
# UI strings, all universal tool pages, static/legal pages, and switch it live.
#   AUTO_PUBLISH on (default; repo variable unset or 'true') → pushes straight to main (Cloudflare deploys it); pages that passed every check are indexable.
#   AUTO_PUBLISH repo variable = 'false' → opens a pull request for native review instead (pages reviewed:false = noindex).
# Run it by hand anytime: Actions → Language launch → Run workflow → lang = es / pt-br / nl / fr / pl / it / en.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language code (empty = whatever is due by the schedule)'
        default: ''
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: { group: language-launch, cancel-in-progress: false }
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Which language?
        id: pick
        run: |
          L="${{ github.event.inputs.lang }}"
          [ -z "$L" ] && L="$(npx tsx scripts/next-locale.ts)"
          echo "lang=$L" >> "$GITHUB_OUTPUT"
          [ -z "$L" ] && echo "Nothing due this week." || echo "Drafting $L"
      - name: Draft language
        if: steps.pick.outputs.lang != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
          PR_BODY: ${{ runner.temp }}/pr-body.md
        run: npx tsx scripts/draft-locale.ts ${{ steps.pick.outputs.lang }} --live
      - name: Check the site still builds
        if: steps.pick.outputs.lang != ''
        run: npm test && npm run build && node scripts/check-links.mjs
      - name: Publish directly (AUTO_PUBLISH)
        if: steps.pick.outputs.lang != '' && vars.AUTO_PUBLISH != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src content
          git commit -m "Launch language ${{ steps.pick.outputs.lang }} (auto-drafted)" && git push
          gh workflow run indexnow.yml --ref main || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Open pull request for review
        if: steps.pick.outputs.lang != '' && vars.AUTO_PUBLISH == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: locale/${{ steps.pick.outputs.lang }}
          title: 'Neue Sprache: ${{ steps.pick.outputs.lang }} (Entwurf zur Prüfung)'
          commit-message: 'Draft language ${{ steps.pick.outputs.lang }}'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: language-launch
